# Builds the Windows app, with the ASR runtime it carries, on a clean runner.
# The libraries are fetched, never committed: see docs/models.md.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch the ASR runtime
        run: go run ./cmd/setup -platform windows/amd64
      - name: Test
        run: go test ./...
      - name: Build
        run: go tool mygo build -platform windows/amd64
        env:
          CGO_ENABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: ottr-windows-amd64
          path: dist/windows-amd64/
