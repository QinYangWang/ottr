</section></main></div><script>(function () {
  var doc = document;
  var toast = doc.createElement('div');
  toast.className = 'doop-toast';
  doc.body.appendChild(toast);
  var toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  // A small menu for a select-like control, built from data-options.
  var pop = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } }
  function openPop(anchor) {
    closePop();
    var opts = (anchor.getAttribute('data-options') || '').split('|');
    var current = anchor.getAttribute('data-value') || opts[0];
    pop = doc.createElement('div');
    pop.className = 'doop-pop';
    opts.forEach(function (o) {
      var b = doc.createElement('button');
      b.className = 'doop-pop-opt' + (o === current ? ' sel' : '');
      b.type = 'button';
      b.textContent = o;
      b.onclick = function (e) {
        e.stopPropagation();
        anchor.setAttribute('data-value', o);
        var v = anchor.querySelector('.val');
        if (v) v.textContent = o; else anchor.textContent = o;
        closePop();
      };
      pop.appendChild(b);
    });
    doc.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    pop.style.minWidth = Math.max(r.width, 180) + 'px';
    pop.style.left = r.left + 'px';
    pop.style.top = (r.bottom + 6) + 'px';
  }
  doc.addEventListener('click', function (e) {
    if (pop && !pop.contains(e.target) && !e.target.closest('.selectbox')) closePop();
  });

  var LANGS = ['Auto', 'English (United States)', '中文（中国）', '日本語（日本）'];
  var MENUS = {
    language: { title: 'Spoken language', options: LANGS },
    model: { title: 'Transcription model', options: ['SenseVoice', 'FunASR Nano', 'Qwen3 ASR'] },
    translation: { title: 'Translation model', options: ['Free online', 'Custom AI model'] },
    style: { title: 'Subtitle style', options: ['12 px', '14 px', '16 px', '18 px'] }
  };

  function renderSub(menu, row) {
    var sub = doc.getElementById('sub');
    if (!sub || !MENUS[menu]) return;
    var board = sub.parentElement.getBoundingClientRect();
    var r = row.getBoundingClientRect();
    var value = row.querySelector('span').textContent.replace('›', '').trim();
    sub.innerHTML = '';
    MENUS[menu].options.forEach(function (o) {
      var b = doc.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (o === value ? ' sel' : '');
      b.textContent = o;
      b.onclick = function (e) {
        e.stopPropagation();
        row.querySelector('span').innerHTML = o + row.querySelector('span').innerHTML.match(/<svg[\s\S]*<\/svg>/)[0];
        sub.setAttribute('hidden', '');
        row.classList.remove('active');
      };
      sub.appendChild(b);
    });
    sub.removeAttribute('hidden');
    sub.style.top = (r.top - board.top) + 'px';
    sub.style.right = (board.right - r.left + 8) + 'px';
    sub.style.left = 'auto';
    doc.querySelectorAll('.item').forEach(function (i) { i.classList.toggle('active', i === row); });
  }

  doc.addEventListener('click', function (e) {
    var el = e.target.closest('button, .media, .card, .item, .opt, .navitem, .seg button, .switch, .sw, .tab, .playbtn, .volbtn, .seek, .selectbox');
    if (!el) return;
    var label = (el.getAttribute('title') || el.textContent || '').trim().replace(/s+/g, ' ');
    if (el.closest('[data-doop-on]')) { if (label) say(label + ' · opens the next screen'); return; }

    if (el.classList.contains('item')) {
      renderSub(el.getAttribute('data-menu'), el);
      return;
    }
    if (el.classList.contains('opt')) return;
    if (el.classList.contains('searchbtn')) {
      var bar = el.closest('.ttools');
      var on = bar.classList.toggle('searching');
      var input = bar.querySelector('.q');
      if (input) { if (on) input.focus(); else input.blur(); }
      return;
    }
    if (el.classList.contains('selectbox')) { openPop(el); return; }
    if (el.classList.contains('tab')) {
      var bar = el.parentElement;
      bar.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === el); });
      var name = el.getAttribute('data-pane');
      doc.querySelectorAll('.pane').forEach(function (p) {
        p.classList.toggle('active', p.getAttribute('data-pane') === name);
      });
      return;
    }
    if (el.classList.contains('source') || el.classList.contains('themecard')) {
      var sibs = el.parentElement.children;
      for (var i = 0; i < sibs.length; i++) sibs[i].classList.toggle('active', sibs[i] === el);
      say((el.textContent || '').trim() + ' selected');
      return;
    }
    if (el.classList.contains('switch') || el.classList.contains('sw')) {
      el.classList.toggle('on');
      return;
    }
    if (el.matches('.seg button')) {
      el.parentElement.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === el); });
      return;
    }
    if (el.classList.contains('playbtn')) {
      var stage = el.closest('.player') || el.closest('.preview');
      var playing = stage.classList.toggle('playing');
      var time = stage.querySelector('.ptime');
      if (time && playing) time.setAttribute('data-live', '1');
      say(playing ? 'Playing' : 'Paused');
      return;
    }
    if (el.classList.contains('volbtn')) {
      var muted = el.classList.toggle('muted');
      say(muted ? 'Muted' : 'Sound on');
      return;
    }
    if (el.classList.contains('seek')) {
      var r = el.getBoundingClientRect();
      var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      el.querySelector('i').style.width = (pct * 100) + '%';
      el.querySelector('b').style.left = (pct * 100) + '%';
      var t = (el.closest('.player') || doc).querySelector('.ptime');
      if (t) {
        var total = 180, cur = Math.round(total * pct);
        t.textContent = Math.floor(cur / 60) + ':' + String(cur % 60).padStart(2, '0') + ' / 3:00';
      }
      say('Seek to ' + Math.round(pct * 100) + '%');
      return;
    }
    var label = (el.getAttribute('title') || el.textContent || '').trim().replace(/\s+/g, ' ');
    if (label) say(label + ' · prototype');
  });

  doc.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closePop();
      var s = doc.getElementById('sub');
      if (s) s.setAttribute('hidden', '');
      var searching = doc.querySelector('.ttools.searching');
      if (searching) searching.classList.remove('searching');
    }
  });
})();
</script></body></html>
