<!doctype html><html><head><link rel="stylesheet" data-doop-webfonts href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}
:root{--r-ctl:6px;--r-card:10px;--r-panel:12px}
body{font-family:"Geist","Segoe UI Variable Text","Noto Sans SC","Microsoft YaHei UI",sans-serif;font-size:13px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden;
--paper:#F3F4F5;--sheet:#FFFFFF;--sunk:#F7F8F9;--hover:#EEF0F2;--ink:#121417;--ink2:#4A5058;--ink3:#7C838C;--ink4:#A6ACB3;--line:#E4E6E9;--line2:#CDD1D6;
--amber:#FFB020;--amber-ink:#8A5600;--amber-soft:#FFF4DB;--amber-line:#F5C46B;--red:#E5383B;--red-ink:#C42B2E;--red-soft:#FDECEC;--green:#1F9D61;--green-soft:#E4F5EC;
--btn:#121417;--btn-ink:#FFFFFF;--media:#1B1E22;--shadow:0 12px 32px rgba(17,20,23,.14),0 2px 6px rgba(17,20,23,.06)}
body.dark{--paper:#0E0F11;--sheet:#16181B;--sunk:#1B1E22;--hover:#22262B;--ink:#EDEEF0;--ink2:#A9AFB7;--ink3:#737A83;--ink4:#555B62;--line:#2A2E33;--line2:#3A3F46;
--amber:#FFB020;--amber-ink:#FFC453;--amber-soft:#33270F;--amber-line:#6B4E14;--red:#E5383B;--red-ink:#FF6B6E;--red-soft:#3A1516;--green:#3DD68C;--green-soft:#12301F;
--btn:#EDEEF0;--btn-ink:#121417;--media:#0A0B0D;--shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3)}
.i{flex:none;display:block}
.mono{font-family:"Geist Mono","Cascadia Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
.lbl{font-family:"Geist Mono","Cascadia Mono",monospace;font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* window chrome */
.tb{height:40px;display:flex;align-items:center;padding-left:16px;background:var(--paper);border-bottom:1px solid var(--line);position:relative}
.wm{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px;letter-spacing:-.3px;color:var(--ink)}
.wm .dot{width:9px;height:9px;border-radius:3px;background:var(--amber)}
.tb .ctx{margin-left:14px;color:var(--ink3);font-size:12px;display:flex;gap:6px;align-items:center}
.wc{margin-left:auto;display:flex;height:40px}
.wc span{width:46px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.recpill{position:absolute;left:50%;transform:translateX(-50%);top:8px;height:24px;padding:0 10px;border-radius:999px;background:var(--red-soft);color:var(--red-ink);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.recdot{width:8px;height:8px;border-radius:50%;background:var(--red)}
/* buttons */
.btn{height:32px;padding:0 12px;border-radius:var(--r-ctl);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:500;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.lg{height:40px;font-size:13.5px;padding:0 16px}
.ib{width:32px;height:32px;border-radius:var(--r-ctl);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.ib.on{background:var(--hover);color:var(--ink)}
.ib.bo{border:1px solid var(--line2);background:var(--sheet)}
.kbd{font-family:"Geist Mono",monospace;font-size:10.5px;height:18px;min-width:18px;padding:0 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;background:var(--sheet)}
/* chips */
.chip{height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px;background:var(--hover);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.am{background:var(--amber-soft);color:var(--amber-ink)}
.chip.bad{background:var(--red-soft);color:var(--red-ink)}
.chip.line{background:transparent;border:1px solid var(--line2)}
/* switch */
.sw{width:32px;height:18px;border-radius:999px;background:var(--line2);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ink)}
.sw.on:after{left:16px}
body.dark .sw.on{background:var(--amber)} body.dark .sw.on:after{background:#121417}
/* select / field */
.sel{height:32px;border:1px solid var(--line2);border-radius:var(--r-ctl);background:var(--sheet);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:var(--ink)}
.sel .i:last-child{margin-left:auto;color:var(--ink3)}
.field{height:32px;border:1px solid var(--line2);border-radius:var(--r-ctl);background:var(--sheet);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink3);font-size:13px}
.field.focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);color:var(--ink)}
/* sidebar */
.sb{width:232px;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px}
.sb .lbl{padding:14px 10px 6px}
.ni{height:32px;border-radius:var(--r-ctl);display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--ink2);font-size:13px}
.ni .n{margin-left:auto;font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink3)}
.ni.on{background:var(--sheet);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
body.dark .ni.on{background:var(--hover);box-shadow:none}
.ni.on .i{color:var(--ink)}
.stat{margin-top:auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--sheet);padding:12px;display:flex;flex-direction:column;gap:10px}
.stat .k{font-size:11px;color:var(--ink3)}
.stat .v{font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px}
.meter{height:4px;border-radius:2px;background:var(--hover);overflow:hidden}
.meter b{display:block;height:100%;background:var(--ink2)}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--green)}
/* rail */
.rail{width:56px;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail .ib{width:36px;height:36px}
.rail .rec{width:36px;height:36px;border-radius:var(--r-ctl);background:var(--btn);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.rail .rec i{width:10px;height:10px;border-radius:50%;background:var(--red);display:block}
/* media mock */
.media{background:var(--media);border-radius:var(--r-card);position:relative;overflow:hidden}
.scr{position:absolute;background:#FFFFFF;border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.scr .bar{height:9%;min-height:6px;background:#E8EBEF;display:flex;align-items:center;gap:3px;padding-left:4%}
.scr .bar i{width:4px;height:4px;border-radius:50%;background:#C3C8CF;display:block}
.scr .bd{flex:1;display:flex}
.scr .side{width:22%;background:#F3F5F7;padding:6% 4%;display:flex;flex-direction:column;gap:7%}
.scr .main{flex:1;padding:6%;display:flex;flex-direction:column;gap:6%}
.ln{height:5%;min-height:3px;border-radius:2px;background:#D5DAE0}
.ln.d{background:#9AA3AE}.ln.a{background:#FFB020}
.tiles{position:absolute;inset:6%;display:grid;grid-template-columns:1fr 1fr;gap:4%}
.tiles>div{border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;position:relative}
.mchip{position:absolute;left:6px;bottom:6px;display:flex;gap:4px}
.mdur{position:absolute;right:6px;bottom:6px;font-family:"Geist Mono",monospace;font-size:10.5px;color:#fff;background:rgba(0,0,0,.62);padding:1px 5px;border-radius:4px}
/* speaker avatar */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex:none}
/* sections */
.sheet{background:var(--sheet)}
.hr{height:1px;background:var(--line)}
.seg{display:flex;gap:6px}

html,body{width:420px;height:800px}

.lib{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--sheet)}
.lhead{padding:18px 24px 0}
.h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.sub{color:var(--ink3);font-size:12px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;margin-top:14px}
.filters{display:flex;gap:6px;padding:12px 24px 10px;border-bottom:1px solid var(--line)}

.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

.lrow{display:flex;gap:14px;align-items:center;padding:8px 12px;border-radius:8px;height:72px}
.lrow .ttl{font-size:13.5px;font-weight:500;color:var(--ink)}
.lrow .meta{font-size:11.5px;color:var(--ink3);margin-top:1px}
.lrow .snip{font-size:12px;color:var(--ink2);margin-top:3px}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:170px;flex:none}
.cap{width:360px;flex:none;background:var(--sheet);border-left:1px solid var(--line);display:flex;flex-direction:column}
.cap .hd{height:52px;display:flex;align-items:center;padding:0 20px;gap:8px;border-bottom:1px solid var(--line)}
.cap .hd b{font-size:14px;font-weight:600}
.cap .cb{padding:14px 20px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.src{flex:1;height:58px;border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;color:var(--ink2);position:relative}

.src.off{color:var(--ink4);border-style:dashed}
.src.off em{position:absolute;top:4px;right:5px;font-style:normal;font-size:9px;font-family:"Geist Mono",monospace;color:var(--ink4)}
.crow{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px}
.crow .t{font-size:12.5px;color:var(--ink)}
.crow .d{font-size:11.5px;color:var(--ink3)}
.lvl{display:flex;gap:2px;align-items:center;height:14px}
.lvl i{width:3px;border-radius:1px;background:var(--line2);display:block}
.lvl i.g{background:var(--green)}
.cap .ft{padding:14px 20px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.recbtn{flex:1;height:44px;border-radius:8px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:14px}
.recbtn .recdot{width:10px;height:10px}
